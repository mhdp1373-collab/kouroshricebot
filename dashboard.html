<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد پی‌بار</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1f232c; --border: #2a2f3a;
    --text: #e8eaed; --muted: #9aa0ab; --primary: #4f8cff; --green: #34c76f;
    --red: #ff5c5c; --orange: #ffb020; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text); font-family: Tahoma, "Segoe UI", sans-serif;
    margin: 0; padding: 0; min-height: 100vh;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; }
  #loginBox, #app { padding: 20px; max-width: 1100px; margin: 0 auto; }
  #loginBox { max-width: 380px; margin-top: 80px; text-align: center; }
  input, textarea, select, button {
    font-family: inherit; font-size: 14px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--panel2); color: var(--text);
    padding: 10px 12px; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--primary); }
  button { cursor: pointer; border: none; font-weight: 600; transition: opacity .15s; }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-green { background: var(--green); color: #06210f; }
  .btn-red { background: var(--red); color: #2b0505; }
  .btn-orange { background: var(--orange); color: #2b1c00; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .stat-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; flex: 1; min-width: 120px; text-align: center;
  }
  .stat-card .num { font-size: 22px; font-weight: 700; }
  .stat-card .label { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 180px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); cursor: pointer; font-size: 13px;
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: var(--radius); overflow: hidden; }
  th, td { padding: 12px 14px; text-align: right; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; background: var(--panel2); }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--panel2); }
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .badge-pending { background: #3a3210; color: var(--orange); }
  .badge-approved { background: #0f3a22; color: var(--green); }
  .badge-rejected { background: #3a1212; color: var(--red); }
  .badge-partial { background: #3a2a10; color: var(--orange); }
  .badge-none { background: #262b34; color: var(--muted); }
  #empty { text-align: center; color: var(--muted); padding: 40px 0; }
  #connErr {
    display: none; background: #3a1212; color: var(--red); border: 1px solid var(--red);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
  }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: flex-start; justify-content: center; z-index: 50; overflow-y: auto; padding: 30px 14px;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    max-width: 640px; width: 100%; padding: 20px;
  }
  .modal h2 { margin-top: 0; font-size: 17px; }
  .modal .close { float: left; cursor: pointer; color: var(--muted); font-size: 20px; }
  .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 14px 0; }
  .doc-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--panel2); }
  .doc-card img { width: 100%; height: 130px; object-fit: cover; display: block; cursor: pointer; }
  .doc-card .doc-file { padding: 20px 12px; text-align: center; font-size: 24px; }
  .doc-card .doc-text { padding: 12px; font-size: 13px; min-height: 60px; display: flex; align-items: center; justify-content: center; text-align: center; }
  .doc-card .doc-label { font-size: 11px; color: var(--muted); padding: 6px 8px; border-top: 1px solid var(--border); }
  .info-line { font-size: 13px; color: var(--muted); margin: 4px 0; }
  .info-line b { color: var(--text); }
  .section-title { font-size: 14px; font-weight: 700; margin: 20px 0 8px; border-top: 1px solid var(--border); padding-top: 16px; }
  .action-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .action-row > button { flex: 1; min-width: 110px; }
  .subform { margin-top: 12px; display: none; }
  .subform.open { display: block; }
  .subform textarea { width: 100%; min-height: 70px; margin-bottom: 8px; resize: vertical; }
  .msgbox textarea { width: 100%; min-height: 60px; margin-bottom: 8px; resize: vertical; }
  .timeline { display: flex; flex-direction: column; gap: 8px; }
  .timeline-item {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px;
    font-size: 12px; background: var(--panel2);
  }
  .timeline-item .ev { font-weight: 700; }
  .timeline-item .meta { color: var(--muted); margin-top: 2px; }
  .no-log { color: var(--muted); font-size: 13px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel2); border: 1px solid var(--border); padding: 10px 20px;
    border-radius: var(--radius); font-size: 13px; z-index: 100; display: none;
  }
  .toast.show { display: block; }
  .toast.err { border-color: var(--red); color: var(--red); }
  .toast.ok { border-color: var(--green); color: var(--green); }
  @media (max-width: 640px) {
    table, thead, tbody, th, td, tr { display: block; }
    thead { display: none; }
    tr.row { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; padding: 8px; }
    td { border: none; padding: 4px 6px; }
    td::before { content: attr(data-label); color: var(--muted); display: inline-block; min-width: 90px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="loginBox">
  <h1>🔐 داشبورد پی‌بار</h1>
  <p style="color:var(--muted); font-size:13px;">توکن دسترسی ادمین را وارد کنید</p>
  <input type="password" id="tokenInput" placeholder="توکن" style="width:100%; margin-bottom:10px;">
  <button class="btn-primary" style="width:100%;" onclick="doLogin()">ورود</button>
  <div id="loginError" style="color:var(--red); font-size:12px; margin-top:8px;"></div>
</div>

<div id="app" style="display:none;">
  <header>
    <h1>📦 داشبورد بارنامه‌ها</h1>
    <button class="btn-ghost" onclick="logout()">خروج</button>
  </header>

  <div style="padding:20px; max-width:1100px; margin:0 auto;">
    <div id="connErr"></div>
    <div class="stats" id="statsRow"></div>

    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="جستجوی شماره بارنامه..." oninput="debouncedLoad()">
      <button class="btn-ghost" onclick="loadList()">🔄 بروزرسانی</button>
    </div>

    <div class="tabs" id="tabsRow" style="margin-bottom:16px;"></div>

    <div id="listWrap">
      <table>
        <thead>
          <tr>
            <th>وضعیت</th><th>شماره بارنامه</th><th>راننده</th><th>نوع محصول</th><th>یادداشت کسری</th><th>مستندات</th><th>تاریخ ثبت</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
      <div id="empty" style="display:none;">چیزی برای نمایش نیست</div>
    </div>
  </div>
</div>

<div class="overlay" id="detailOverlay">
  <div class="modal">
    <span class="close" onclick="closeDetail()">✕</span>
    <div id="detailContent">در حال بارگذاری...</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let TOKEN = localStorage.getItem('pibar_token') || '';
let currentStatus = 'all';
let currentBarname = null;
let debounceTimer = null;

const STATUS_LABELS = {
  all: 'همه', pending: '🕐 در انتظار', approved: '✅ تایید شده',
  rejected: '❌ رد شده', partial: '⚠️ کسری بار', none: 'ثبت‌نشده'
};
const BADGE_CLASS = {
  pending: 'badge-pending', approved: 'badge-approved',
  rejected: 'badge-rejected', partial: 'badge-partial', none: 'badge-none'
};

function toast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (ok ? 'ok' : 'err');
  setTimeout(() => t.className = 'toast', 3000);
}

function showConnErr(msg) {
  const el = document.getElementById('connErr');
  if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
  el.style.display = 'block';
  el.textContent = '⚠️ ' + msg;
}

function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(loadList, 350);
}

async function apiFetch(path, opts) {
  opts = opts || {};
  const isForm = opts.body instanceof FormData;
  opts.headers = Object.assign(
    { 'X-Dashboard-Token': TOKEN },
    isForm ? {} : { 'Content-Type': 'application/json' },
    opts.headers || {}
  );
  let res;
  try {
    res = await fetch(path, opts);
  } catch (netErr) {
    throw new Error('اتصال به سرور برقرار نشد (شبکه/آدرس را چک کنید): ' + netErr.message);
  }
  if (res.status === 401) { logout(); throw new Error('توکن نامعتبر است'); }
  let data = {};
  try { data = await res.json(); } catch (e) { /* بدنه خالی یا غیر JSON */ }
  if (!res.ok) throw new Error(data.detail || ('خطای سرور (کد ' + res.status + ')'));
  return data;
}

function doLogin() {
  const val = document.getElementById('tokenInput').value.trim();
  if (!val) return;
  TOKEN = val;
  localStorage.setItem('pibar_token', TOKEN);
  checkAndEnter();
}

function logout() {
  localStorage.removeItem('pibar_token');
  TOKEN = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
}

async function checkAndEnter() {
  try {
    await apiFetch('/api/barnames?status=all');
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderTabs();
    loadList();
  } catch (e) {
    document.getElementById('loginError').textContent = 'ورود ناموفق: ' + e.message;
  }
}

function renderTabs() {
  const wrap = document.getElementById('tabsRow');
  wrap.innerHTML = '';
  Object.keys(STATUS_LABELS).forEach(key => {
    const el = document.createElement('div');
    el.className = 'tab' + (key === currentStatus ? ' active' : '');
    el.textContent = STATUS_LABELS[key];
    el.onclick = () => { currentStatus = key; renderTabs(); loadList(); };
    wrap.appendChild(el);
  });
}

async function loadList() {
  const search = document.getElementById('searchInput').value.trim();
  const params = new URLSearchParams({ status: currentStatus, search });
  try {
    const rows = await apiFetch('/api/barnames?' + params.toString());
    showConnErr(null);
    renderStats();
    renderList(rows);
  } catch (e) {
    showConnErr(e.message);
    renderList([]);
  }
}

async function renderStats() {
  try {
    const rows = await apiFetch('/api/barnames?status=all');
    const counts = { pending: 0, approved: 0, rejected: 0, partial: 0, none: 0 };
    rows.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });
    const wrap = document.getElementById('statsRow');
    wrap.innerHTML = '';
    const items = [
      ['کل بارنامه‌ها', rows.length],
      ['در انتظار بررسی', counts.pending],
      ['تایید شده', counts.approved],
      ['رد شده', counts.rejected],
      ['کسری بار', counts.partial],
    ];
    items.forEach(([label, num]) => {
      const card = document.createElement('div');
      card.className = 'stat-card';
      card.innerHTML = `<div class="num">${num}</div><div class="label">${label}</div>`;
      wrap.appendChild(card);
    });
  } catch (e) { /* خطا همان بالا توسط loadList نشان داده می‌شود */ }
}

function renderList(rows) {
  const body = document.getElementById('listBody');
  body.innerHTML = '';
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.className = 'row';
    tr.onclick = () => openDetail(r.barname);
    tr.innerHTML = `
      <td data-label="وضعیت"><span class="badge ${BADGE_CLASS[r.status] || 'badge-none'}">${escapeHtml(r.status_label)}</span></td>
      <td data-label="بارنامه"><b>${escapeHtml(r.barname)}</b></td>
      <td data-label="راننده">${escapeHtml(r.driver_name || '-')}</td>
      <td data-label="نوع محصول">${r.product_type ? escapeHtml(r.product_type) : '<span style="color:var(--muted);">—</span>'}</td>
      <td data-label="یادداشت کسری">${r.deduction_note ? '⚠️ با کسری تایید شده — ' + escapeHtml(r.deduction_note) : '<span style="color:var(--muted);">—</span>'}</td>
      <td data-label="مستندات">${r.doc_count}</td>
      <td data-label="تاریخ">${escapeHtml(r.created_at || '-')}</td>
    `;
    body.appendChild(tr);
  });
}

async function openDetail(barname) {
  currentBarname = barname;
  const overlay = document.getElementById('detailOverlay');
  overlay.classList.add('open');
  document.getElementById('detailContent').innerHTML = 'در حال بارگذاری...';
  try {
    const data = await apiFetch('/api/barnames/' + encodeURIComponent(barname));
    renderDetail(data);
  } catch (e) {
    document.getElementById('detailContent').innerHTML = 'خطا: ' + escapeHtml(e.message);
  }
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  currentBarname = null;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = (s === null || s === undefined) ? '' : String(s);
  return d.innerHTML;
}

function docCardHtml(barname, d) {
  if (d.file_type === 'text') {
    return `<div class="doc-card"><div class="doc-text">${escapeHtml(d.text || '-')}</div><div class="doc-label">${escapeHtml(d.label)}</div></div>`;
  }
  const url = `/api/barnames/${encodeURIComponent(barname)}/doc/${encodeURIComponent(d.key)}/file?token=${encodeURIComponent(TOKEN)}`;
  if (d.file_type === 'photo') {
    return `<div class="doc-card"><img src="${url}" loading="lazy" onclick="window.open('${url}','_blank')"><div class="doc-label">${escapeHtml(d.label)}</div></div>`;
  }
  return `<div class="doc-card"><a href="${url}" target="_blank" style="text-decoration:none; color:inherit;"><div class="doc-file">📄</div></a><div class="doc-label">${escapeHtml(d.label)}</div></div>`;
}

function attachmentCardHtml(barname, a) {
  const url = `/api/barnames/${encodeURIComponent(barname)}/attachment/${encodeURIComponent(a.id)}/file?token=${encodeURIComponent(TOKEN)}`;
  const who = escapeHtml(a.uploaded_by || 'ادمین');
  const cap = a.caption ? `<br>${escapeHtml(a.caption)}` : '';
  if (a.file_type === 'photo') {
    return `<div class="doc-card"><img src="${url}" loading="lazy" onclick="window.open('${url}','_blank')"><div class="doc-label">📎 ${who}<br>${escapeHtml(a.uploaded_at || '')}${cap}</div></div>`;
  }
  return `<div class="doc-card"><a href="${url}" target="_blank" style="text-decoration:none; color:inherit;"><div class="doc-file">📄</div></a><div class="doc-label">📎 ${who}<br>${escapeHtml(a.uploaded_at || '')}${cap}</div></div>`;
}

function logItemHtml(item) {
  const event = escapeHtml(item.event || '');
  const actor = escapeHtml(item.actor || '');
  const detail = item.detail ? ` — ${escapeHtml(item.detail)}` : '';
  const time = escapeHtml(item.time || item.at || '');
  return `<div class="timeline-item"><div class="ev">${event}</div><div class="meta">${actor}${detail} ${time ? '· ' + time : ''}</div></div>`;
}

function renderDetail(data) {
  const review = data.review || {};
  const status = review.status || 'none';

  const docsHtml = (data.documents || []).map(d => docCardHtml(data.barname, d)).join('');
  const attachmentsHtml = (data.admin_attachments || []).map(a => attachmentCardHtml(data.barname, a)).join('');

  let actionsHtml = '';
  if (status === 'pending') {
    actionsHtml = `
      <div class="action-row">
        <button class="btn-green" onclick="doApprove()">✅ تایید</button>
        <button class="btn-red" onclick="toggleForm('rejectForm')">❌ عدم تایید</button>
        <button class="btn-orange" onclick="toggleForm('partialForm')">⚠️ تایید با کسری بار</button>
      </div>
      <div class="subform" id="rejectForm">
        <textarea id="rejectReason" placeholder="علت عدم تایید را بنویسید..."></textarea>
        <button class="btn-red" onclick="doReject()">ارسال عدم تایید</button>
      </div>
      <div class="subform" id="partialForm">
        <textarea id="partialNote" placeholder="مقدار کسری بار را بنویسید (مثلاً: ۲ تن)..."></textarea>
        <button class="btn-orange" onclick="doPartial()">ارسال تایید با کسری بار</button>
      </div>
    `;
  } else if (status === 'partial') {
    const dr = review.driver_response;
    let driverNote = '🕐 راننده هنوز به کسری بار پاسخ نداده است.';
    if (dr === 'accepted') driverNote = '✅ راننده کسری بار را پذیرفته است.';
    if (dr === 'rejected') driverNote = '❌ راننده کسری بار را قبول ندارد' + (review.driver_reason ? ` — علت: ${escapeHtml(review.driver_reason)}` : '') + '. لطفاً مستقیماً با راننده هماهنگ کنید.';
    actionsHtml = `
      <p class="info-line"><b>مقدار کسری اعلام‌شده:</b> ${escapeHtml(review.deduction_note || '-')}</p>
      <p class="info-line">${driverNote}</p>
      <div class="action-row">
        <button class="btn-green" onclick="doApprove()">✅ تایید نهایی بارنامه</button>
      </div>
      <p class="info-line" style="color:var(--muted); font-size:12px;">تا زدن این دکمه، بارنامه «تایید شده» محسوب نمی‌شود و مبلغی واریز نخواهد شد.</p>
    `;
  } else {
    actionsHtml = `<p class="info-line">این بارنامه قبلاً بررسی شده و دیگر قابل تغییر از این بخش نیست.</p>`;
    if (review.reason) actionsHtml += `<p class="info-line"><b>علت رد:</b> ${escapeHtml(review.reason)}</p>`;
    if (review.deduction_note) actionsHtml += `<p class="info-line"><b>مقدار کسری:</b> ${escapeHtml(review.deduction_note)}</p>`;
  }

  const logItems = (data.log || []).slice().reverse();
  const logHtml = logItems.length
    ? `<div class="timeline">${logItems.map(logItemHtml).join('')}</div>`
    : `<p class="no-log">هنوز رویدادی برای این بارنامه ثبت نشده.</p>`;

  document.getElementById('detailContent').innerHTML = `
    <h2>📦 بارنامه ${escapeHtml(data.barname)} <span class="badge ${BADGE_CLASS[status] || 'badge-none'}">${escapeHtml(data.status_label)}</span></h2>
    <div class="info-line">👤 راننده: <b>${escapeHtml(data.driver_name || '-')}</b> (آیدی: ${escapeHtml(data.driver_id || '-')})</div>
    <div class="info-line">🕐 تاریخ ثبت: ${escapeHtml(data.created_at || '-')}</div>
    ${data.completed_at ? `<div class="info-line">📤 تاریخ ارسال نهایی: ${escapeHtml(data.completed_at)}</div>` : ''}
    <div class="msgbox" style="border-top:none; padding-top:0; margin-top:12px;">
      <div class="info-line" style="margin-bottom:6px;">🌾 نوع محصول</div>
      <input type="text" id="productTypeInput" placeholder="مثلاً: برنج ایرانی، برنج خارجی، شکر، آرد و ..." value="${escapeHtml(data.product_type || '')}" style="width:100%; margin-bottom:8px;">
      <button class="btn-primary" onclick="saveProductType()">ذخیره نوع محصول</button>
    </div>
    <div class="doc-grid">${docsHtml || '<p class="info-line">مستندی یافت نشد</p>'}</div>
    ${actionsHtml}
    <div class="section-title">📎 عکس/فایل‌های افزوده‌شده توسط ادمین</div>
    <div class="doc-grid">${attachmentsHtml || '<p class="info-line">هنوز چیزی اضافه نشده.</p>'}</div>
    <div class="msgbox">
      <div class="info-line" style="margin-bottom:6px;">📎 افزودن عکس/فایل جدید به این بارنامه</div>
      <input type="file" id="attachmentFile" style="margin-bottom:8px; width:100%;">
      <input type="text" id="attachmentCaption" placeholder="توضیح کوتاه (اختیاری)" style="margin-bottom:8px; width:100%;">
      <button class="btn-primary" onclick="doUploadAttachment()">آپلود</button>
    </div>
    <div class="msgbox">
      <div class="info-line" style="margin-bottom:6px;">✉️ ارسال پیام آزاد به راننده</div>
      <textarea id="freeMessage" placeholder="متن پیام..."></textarea>
      <button class="btn-primary" onclick="sendFreeMessage()">ارسال پیام</button>
    </div>
    <div class="section-title">📜 تاریخچه بارنامه</div>
    ${logHtml}
  `;
}

function toggleForm(id) {
  document.querySelectorAll('.subform').forEach(el => el.classList.remove('open'));
  document.getElementById(id).classList.add('open');
}

async function saveProductType() {
  const val = document.getElementById('productTypeInput').value.trim();
  try {
    await apiFetch(`/api/barnames/${encodeURIComponent(currentBarname)}/product-type`, {
      method: 'POST', body: JSON.stringify({ type: val })
    });
    toast('نوع محصول ذخیره شد', true);
    loadList();
  } catch (e) { toast(e.message, false); }
}

async function doApprove() {
  if (!confirm('تایید این بارنامه ثبت شود؟')) return;
  try {
    await apiFetch(`/api/barnames/${encodeURIComponent(currentBarname)}/approve`, { method: 'POST' });
    toast('تایید شد و به راننده اطلاع داده شد', true);
    closeDetail(); loadList();
  } catch (e) { toast(e.message, false); }
}

async function doReject() {
  const reason = document.getElementById('rejectReason').value.trim();
  if (!reason) { toast('علت را بنویسید', false); return; }
  try {
    await apiFetch(`/api/barnames/${encodeURIComponent(currentBarname)}/reject`, {
      method: 'POST', body: JSON.stringify({ reason })
    });
    toast('عدم تایید ثبت و به راننده اطلاع داده شد', true);
    closeDetail(); loadList();
  } catch (e) { toast(e.message, false); }
}

async function doPartial() {
  const note = document.getElementById('partialNote').value.trim();
  if (!note) { toast('مقدار کسری را بنویسید', false); return; }
  try {
    await apiFetch(`/api/barnames/${encodeURIComponent(currentBarname)}/partial`, {
      method: 'POST', body: JSON.stringify({ note })
    });
    toast('تایید با کسری بار ثبت و به راننده اطلاع داده شد', true);
    closeDetail(); loadList();
  } catch (e) { toast(e.message, false); }
}

async function doUploadAttachment() {
  const input = document.getElementById('attachmentFile');
  const capInput = document.getElementById('attachmentCaption');
  const f = input.files[0];
  if (!f) { toast('یک عکس یا فایل انتخاب کنید', false); return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('caption', capInput ? capInput.value.trim() : '');
  try {
    await apiFetch(`/api/barnames/${encodeURIComponent(currentBarname)}/attachment`, { method: 'POST', body: fd });
    toast('عکس/فایل ذخیره شد', true);
    input.value = '';
    if (capInput) capInput.value = '';
    openDetail(currentBarname);
  } catch (e) { toast(e.message, false); }
}

async function sendFreeMessage() {
  const text = document.getElementById('freeMessage').value.trim();
  if (!text) { toast('متن پیام را بنویسید', false); return; }
  try {
    await apiFetch(`/api/barnames/${encodeURIComponent(currentBarname)}/message`, {
      method: 'POST', body: JSON.stringify({ text })
    });
    toast('پیام برای راننده ارسال شد', true);
    document.getElementById('freeMessage').value = '';
  } catch (e) { toast(e.message, false); }
}

if (TOKEN) checkAndEnter();
</script>
</body>
</html>
