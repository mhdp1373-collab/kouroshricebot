<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پی‌بار — دفتر بارنامه‌ها</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16213a;
    --ink-2:#223059;
    --paper:#f6f3ec;
    --paper-2:#efe9dc;
    --card:#ffffff;
    --line:#e4ddcc;
    --amber:#c07a2c;
    --amber-dark:#9c5f1f;
    --green:#2e7d4f;
    --green-bg:#e5f3ea;
    --red:#b23a2e;
    --red-bg:#fbe9e6;
    --blue:#2f5f9e;
    --blue-bg:#e8eef8;
    --gray:#6b6656;
    --gray-bg:#eeeae0;
    --shadow: 0 8px 24px rgba(22,33,58,.08), 0 1px 3px rgba(22,33,58,.06);
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    min-height:100vh;
  }
  ::selection{background:#f0d9b5}

  /* ── هدر ── */
  header{
    background:linear-gradient(180deg,var(--ink),var(--ink-2));
    color:#f2ede0;
    padding:22px 28px 26px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .header-row{display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; position:relative; z-index:1}
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{font-size:22px; font-weight:800; margin:0; letter-spacing:.2px}
  .brand span{font-family:var(--mono); font-size:12px; color:#c9bfa0; letter-spacing:1px}
  .token-box{display:flex; align-items:center; gap:8px}
  .token-box input{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18);
    color:#f2ede0; border-radius:9px; padding:9px 12px; font-family:var(--mono);
    font-size:13px; width:220px; outline:none;
  }
  .token-box input::placeholder{color:#a79f88}
  .token-box input:focus{border-color:var(--amber)}
  .btn{
    border:none; border-radius:9px; padding:9px 16px; font-family:inherit;
    font-size:13.5px; font-weight:600; cursor:pointer; transition:.15s transform, .15s filter;
  }
  .btn:active{transform:translateY(1px)}
  .btn-amber{background:var(--amber); color:#fff}
  .btn-amber:hover{filter:brightness(1.08)}
  .btn-ghost{background:rgba(255,255,255,.1); color:#f2ede0; border:1px solid rgba(255,255,255,.2)}
  .btn-ghost:hover{background:rgba(255,255,255,.16)}
  #tokenStatus{font-family:var(--mono); font-size:11.5px; color:#c9bfa0}
  #tokenStatus.ok{color:#8fd6a8}
  #tokenStatus.bad{color:#e79b8f}

  /* ── نوار آمار ── */
  .stats{
    display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:12px;
    overflow:hidden; margin:20px 28px 0; box-shadow:var(--shadow);
  }
  .stat{background:var(--card); padding:14px 16px; cursor:pointer; transition:.15s background}
  .stat:hover{background:var(--paper-2)}
  .stat.active{background:var(--ink); }
  .stat.active .stat-num, .stat.active .stat-label{color:#f2ede0}
  .stat-num{font-family:var(--mono); font-size:22px; font-weight:700; display:block}
  .stat-label{font-size:12px; color:var(--gray); margin-top:2px; display:block}

  /* ── نوار ابزار ── */
  .toolbar{
    display:flex; gap:10px; align-items:center; margin:16px 28px 8px; flex-wrap:wrap;
  }
  .toolbar input[type=search]{
    flex:1; min-width:220px; padding:10px 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); font-family:inherit; font-size:13.5px; outline:none;
  }
  .toolbar input[type=search]:focus{border-color:var(--amber)}

  main{padding:6px 28px 60px}

  /* ── جدول بارنامه‌ها ── */
  .list{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden}
  .row{
    display:grid; grid-template-columns:150px 1fr 150px 90px 130px 26px;
    gap:10px; align-items:center; padding:13px 18px; border-bottom:1px solid var(--line);
    cursor:pointer; transition:.12s background;
  }
  .row:last-child{border-bottom:none}
  .row:hover{background:var(--paper-2)}
  .row .bn{font-family:var(--mono); font-weight:600; font-size:14px}
  .row .driver{font-size:13.5px; color:#3a3624}
  .row .driver small{display:block; color:var(--gray); font-family:var(--mono); font-size:11px}
  .row .date{font-family:var(--mono); font-size:12px; color:var(--gray)}
  .row .docs{font-family:var(--mono); font-size:12px; color:var(--gray); text-align:center}
  .row .chev{color:var(--gray); font-size:13px}
  .head-row{
    display:grid; grid-template-columns:150px 1fr 150px 90px 130px 26px; gap:10px;
    padding:10px 18px; font-size:11.5px; color:var(--gray); border-bottom:1px solid var(--line);
    background:var(--paper-2);
  }
  .empty{padding:50px 20px; text-align:center; color:var(--gray)}
  .empty b{display:block; color:var(--ink); font-size:15px; margin-bottom:6px}

  .badge{
    display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px;
    font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .badge.approved{background:var(--green-bg); color:var(--green)}
  .badge.rejected{background:var(--red-bg); color:var(--red)}
  .badge.partial{background:#fbf0dd; color:var(--amber-dark)}
  .badge.pending{background:var(--blue-bg); color:var(--blue)}
  .badge.none{background:var(--gray-bg); color:var(--gray)}

  /* ── پنل جزئیات (کشویی از راست) ── */
  .overlay{
    position:fixed; inset:0; background:rgba(22,25,35,.42); backdrop-filter:blur(1px);
    opacity:0; pointer-events:none; transition:.2s opacity; z-index:40;
  }
  .overlay.show{opacity:1; pointer-events:auto}
  .panel{
    position:fixed; top:0; bottom:0; right:0; width:min(560px,100%);
    background:var(--paper); box-shadow:-16px 0 40px rgba(0,0,0,.18);
    transform:translateX(100%); transition:.25s transform cubic-bezier(.2,.8,.3,1);
    z-index:41; display:flex; flex-direction:column;
  }
  .panel.show{transform:translateX(0)}
  .panel-head{
    background:linear-gradient(180deg,var(--ink),var(--ink-2)); color:#f2ede0;
    padding:20px 24px; flex:0 0 auto;
  }
  .panel-head .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .panel-head .bn{font-family:var(--mono); font-size:19px; font-weight:700}
  .panel-head .close{background:none; border:none; color:#cfc7ac; font-size:20px; cursor:pointer; line-height:1; padding:4px}
  .panel-head .close:hover{color:#fff}
  .panel-meta{display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; font-size:12.5px; color:#cfc7ac}
  .panel-meta b{color:#f2ede0; font-weight:600}
  .panel-body{overflow-y:auto; flex:1 1 auto; padding:20px 24px 40px}
  .section-title{
    font-size:12.5px; font-weight:700; color:var(--gray); text-transform:uppercase;
    letter-spacing:.5px; margin:26px 0 12px; display:flex; align-items:center; gap:8px;
  }
  .section-title:first-child{margin-top:0}
  .section-title::after{content:""; flex:1; height:1px; background:var(--line)}

  /* اسناد */
  .docs-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .doc-card{background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .doc-card img{width:100%; height:120px; object-fit:cover; display:block; background:var(--paper-2)}
  .doc-card .doc-label{padding:8px 10px; font-size:12px; font-weight:600}
  .doc-card .doc-text{padding:8px 10px 12px; font-family:var(--mono); font-size:12.5px; color:var(--ink-2); word-break:break-all}
  .doc-card a.doc-link{display:block; padding:8px 10px 12px; font-size:12px; color:var(--blue); text-decoration:none}
  .doc-card a.doc-link:hover{text-decoration:underline}

  /* اقدامات */
  .actions-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .act-btn{
    padding:10px 8px; border-radius:9px; border:1px solid var(--line); background:var(--card);
    font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; transition:.15s;
  }
  .act-btn:hover{filter:brightness(.97)}
  .act-btn.approve{color:var(--green); border-color:#bfe0cc}
  .act-btn.reject{color:var(--red); border-color:#eec4bd}
  .act-btn.partial{color:var(--amber-dark); border-color:#e9cfa0}
  .act-form{display:none; margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px}
  .act-form.show{display:block}
  .act-form textarea{
    width:100%; min-height:64px; border:1px solid var(--line); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:13px; resize:vertical; outline:none;
  }
  .act-form textarea:focus{border-color:var(--amber)}
  .act-form .row-btns{display:flex; gap:8px; margin-top:8px}
  .act-form .row-btns .btn{flex:1; padding:8px}
  .msg-box{margin-top:14px}
  .msg-box textarea{width:100%; min-height:56px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-family:inherit; font-size:13px; outline:none}
  .msg-box textarea:focus{border-color:var(--amber)}
  .msg-box button{margin-top:8px}

  .review-note{
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
    font-size:13px; line-height:1.9;
  }
  .review-note b{color:var(--ink)}

  /* تاریخچه / لاگ */
  .timeline{position:relative; padding-right:22px}
  .timeline::before{
    content:""; position:absolute; right:6px; top:4px; bottom:4px; width:2px; background:var(--line);
  }
  .tl-item{position:relative; padding-bottom:18px}
  .tl-item:last-child{padding-bottom:0}
  .tl-dot{
    position:absolute; right:-22px; top:2px; width:13px; height:13px; border-radius:50%;
    background:var(--card); border:3px solid var(--gray);
  }
  .tl-item.ev-approved .tl-dot{border-color:var(--green)}
  .tl-item.ev-rejected .tl-dot{border-color:var(--red)}
  .tl-item.ev-partial .tl-dot{border-color:var(--amber)}
  .tl-item.ev-driver .tl-dot{border-color:var(--blue)}
  .tl-card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px}
  .tl-time{font-family:var(--mono); font-size:11px; color:var(--gray)}
  .tl-event{font-size:13.5px; font-weight:700; margin:2px 0 3px}
  .tl-actor{font-size:12px; color:var(--gray)}
  .tl-detail{font-size:12.5px; color:#3a3624; margin-top:5px; line-height:1.7; white-space:pre-wrap}
  .no-log{color:var(--gray); font-size:13px; padding:6px 2px}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:#f2ede0; padding:11px 22px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:.2s; z-index:60; box-shadow:var(--shadow);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .toast.err{background:var(--red)}

  @media (max-width:760px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .row, .head-row{grid-template-columns:1fr 1fr}
    .row .docs, .row .chev, .head-row > span:nth-child(4), .head-row > span:nth-child(6){display:none}
    .docs-grid{grid-template-columns:1fr}
    .actions-grid{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <h1>📦 دفتر بارنامه‌های پی‌بار</h1>
      <span>PIBAR ADMIN LOG</span>
    </div>
    <div class="token-box">
      <span id="tokenStatus">توکن وارد نشده</span>
      <input id="tokenInput" type="password" placeholder="DASHBOARD_TOKEN" autocomplete="off">
      <button class="btn btn-amber" onclick="saveToken()">ورود</button>
      <button class="btn btn-ghost" onclick="loadAll()">🔄 به‌روزرسانی</button>
    </div>
  </div>
</header>

<div class="stats" id="statsRow"></div>

<div class="toolbar">
  <input type="search" id="searchInput" placeholder="جست‌وجوی شماره بارنامه یا نام راننده…" oninput="renderList()">
</div>

<main>
  <div class="list" id="listBox">
    <div class="empty"><b>در حال بارگذاری…</b>توکن داشبورد را وارد کن تا لیست بارنامه‌ها نمایش داده شود.</div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-head">
    <div class="top">
      <div>
        <div class="bn" id="pBarname">—</div>
        <div id="pBadgeWrap" style="margin-top:6px"></div>
      </div>
      <button class="close" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-meta">
      <span>👤 <b id="pDriver">—</b></span>
      <span>🕐 ثبت: <b id="pCreated">—</b></span>
      <span>✅ ثبت نهایی: <b id="pCompleted">—</b></span>
    </div>
  </div>
  <div class="panel-body" id="pBody">
    <!-- با جاوااسکریپت پر می‌شود -->
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_LABELS = {
  approved: {text:'✅ تایید شده', cls:'approved'},
  rejected: {text:'❌ عدم تایید', cls:'rejected'},
  partial:  {text:'⚠️ کسری بار', cls:'partial'},
  pending:  {text:'🕐 در انتظار بررسی', cls:'pending'},
  none:     {text:'⏳ ثبت نشده', cls:'none'},
};
const STAT_ORDER = ['all','pending','partial','approved','rejected'];
const STAT_TITLES = {all:'همه', pending:'در انتظار', partial:'کسری بار', approved:'تایید شده', rejected:'عدم تایید'};

let TOKEN = localStorage.getItem('pibar_dashboard_token') || '';
let ALL_ROWS = [];
let ACTIVE_STATUS = 'all';
let CURRENT_BARNAME = null;

function $(id){ return document.getElementById(id); }

function toast(msg, isErr){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(()=> t.className='toast', 2600);
}

async function api(path, opts={}){
  const headers = Object.assign({'X-Dashboard-Token': TOKEN}, opts.headers || {});
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  if(!res.ok){
    let detail = res.statusText;
    try{ const j = await res.json(); detail = j.detail || detail; }catch(e){}
    throw new Error(detail || ('خطای ' + res.status));
  }
  return res.status === 204 ? null : res.json();
}

function saveToken(){
  TOKEN = $('tokenInput').value.trim();
  localStorage.setItem('pibar_dashboard_token', TOKEN);
  $('tokenInput').value = '';
  loadAll();
}

async function loadAll(){
  if(!TOKEN){
    $('tokenStatus').textContent = 'توکن وارد نشده';
    $('tokenStatus').className = 'bad';
    return;
  }
  try{
    ALL_ROWS = await api('/api/barnames?status=all&search=');
    $('tokenStatus').textContent = 'متصل ✓';
    $('tokenStatus').className = 'ok';
    renderStats();
    renderList();
  }catch(e){
    $('tokenStatus').textContent = 'توکن نامعتبر';
    $('tokenStatus').className = 'bad';
    $('listBox').innerHTML = `<div class="empty"><b>ورود ناموفق</b>${e.message}</div>`;
  }
}

function renderStats(){
  const counts = {all: ALL_ROWS.length, pending:0, partial:0, approved:0, rejected:0};
  ALL_ROWS.forEach(r=>{ if(counts[r.status] !== undefined) counts[r.status]++; });
  $('statsRow').innerHTML = STAT_ORDER.map(k => `
    <div class="stat ${ACTIVE_STATUS===k?'active':''}" onclick="setStatusFilter('${k}')">
      <span class="stat-num">${counts[k]}</span>
      <span class="stat-label">${STAT_TITLES[k]}</span>
    </div>
  `).join('');
}

function setStatusFilter(k){
  ACTIVE_STATUS = k;
  renderStats();
  renderList();
}

function renderList(){
  const q = $('searchInput').value.trim();
  let rows = ALL_ROWS.filter(r => ACTIVE_STATUS==='all' || r.status===ACTIVE_STATUS);
  if(q){
    rows = rows.filter(r =>
      r.barname.includes(q) || (r.driver_name||'').includes(q)
    );
  }
  if(rows.length===0){
    $('listBox').innerHTML = `<div class="empty"><b>چیزی پیدا نشد</b>فیلتر یا عبارت جست‌وجو را تغییر بده.</div>`;
    return;
  }
  const head = `<div class="head-row"><span>شماره بارنامه</span><span>راننده</span><span>تاریخ ثبت</span><span>مستندات</span><span>وضعیت</span><span></span></div>`;
  const body = rows.map(r => {
    const st = STATUS_LABELS[r.status] || STATUS_LABELS.none;
    return `
      <div class="row" onclick="openPanel('${escAttr(r.barname)}')">
        <span class="bn">${esc(r.barname)}</span>
        <span class="driver">${esc(r.driver_name||'-')}<small>${r.driver_id||''}</small></span>
        <span class="date">${esc(r.created_at||'-')}</span>
        <span class="docs">${r.doc_count} سند</span>
        <span><span class="badge ${st.cls}">${st.text}</span></span>
        <span class="chev">◂</span>
      </div>`;
  }).join('');
  $('listBox').innerHTML = head + body;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }

/* ── پنل جزئیات ── */
async function openPanel(barname){
  CURRENT_BARNAME = barname;
  $('overlay').classList.add('show');
  $('panel').classList.add('show');
  $('pBarname').textContent = barname;
  $('pBody').innerHTML = `<div class="empty"><b>در حال بارگذاری…</b></div>`;
  try{
    const d = await api('/api/barnames/' + encodeURIComponent(barname));
    renderPanel(d);
  }catch(e){
    $('pBody').innerHTML = `<div class="empty"><b>خطا</b>${esc(e.message)}</div>`;
  }
}

function closePanel(){
  $('overlay').classList.remove('show');
  $('panel').classList.remove('show');
  CURRENT_BARNAME = null;
}

function renderPanel(d){
  const st = STATUS_LABELS[(d.review && d.review.status) || 'none'] || STATUS_LABELS.none;
  $('pBadgeWrap').innerHTML = `<span class="badge ${st.cls}">${st.text}</span>`;
  $('pDriver').textContent = `${d.driver_name || '-'} (${d.driver_id || '-'})`;
  $('pCreated').textContent = d.created_at || '-';
  $('pCompleted').textContent = d.completed_at || '—';

  const docsHtml = (d.documents||[]).map(doc => {
    const fileUrl = `/api/barnames/${encodeURIComponent(d.barname)}/doc/${encodeURIComponent(doc.key)}/file?token=${encodeURIComponent(TOKEN)}`;
    if(doc.file_type === 'photo'){
      return `<div class="doc-card">
        <a href="${fileUrl}" target="_blank"><img src="${fileUrl}" alt="${esc(doc.label)}"></a>
        <div class="doc-label">${esc(doc.label)}</div>
      </div>`;
    }else if(doc.text){
      return `<div class="doc-card">
        <div class="doc-label">${esc(doc.label)}</div>
        <div class="doc-text">${esc(doc.text)}</div>
      </div>`;
    }else{
      return `<div class="doc-card">
        <div class="doc-label">${esc(doc.label)}</div>
        <a class="doc-link" href="${fileUrl}" target="_blank">📎 مشاهده / دانلود فایل</a>
      </div>`;
    }
  }).join('') || `<div class="no-log">مستندی ثبت نشده.</div>`;

  const review = d.review || {};
  let noteHtml = '';
  if(review.status === 'rejected' && review.reason){
    noteHtml = `<div class="review-note"><b>علت عدم تایید:</b> ${esc(review.reason)}</div>`;
  }else if(review.status === 'partial'){
    const resp = review.driver_response === 'accepted' ? '✅ راننده پذیرفته'
               : review.driver_response === 'rejected' ? '❌ راننده نپذیرفته — ' + esc(review.driver_reason||'')
               : '🕐 هنوز پاسخی از راننده نرسیده';
    noteHtml = `<div class="review-note"><b>مقدار کسری بار:</b> ${esc(review.deduction_note||'-')}<br><b>پاسخ راننده:</b> ${resp}</div>`;
  }

  const canAct = review.status === 'pending';
  const actionsHtml = canAct ? `
    <div class="actions-grid">
      <button class="act-btn approve" onclick="doApprove()">✅ تایید</button>
      <button class="act-btn reject" onclick="toggleForm('rejectForm')">❌ عدم تایید</button>
      <button class="act-btn partial" onclick="toggleForm('partialForm')">⚠️ کسری بار</button>
    </div>
    <div class="act-form" id="rejectForm">
      <textarea id="rejectReason" placeholder="علت عدم تایید را بنویس…"></textarea>
      <div class="row-btns">
        <button class="btn btn-amber" style="background:var(--red)" onclick="doReject()">ثبت عدم تایید</button>
      </div>
    </div>
    <div class="act-form" id="partialForm">
      <textarea id="partialNote" placeholder="مقدار کسری بار را بنویس، مثلاً: ۲ تن"></textarea>
      <div class="row-btns">
        <button class="btn btn-amber" onclick="doPartial()">ثبت کسری بار</button>
      </div>
    </div>
  ` : `<div class="no-log">این بارنامه دیگر در وضعیت «در انتظار بررسی» نیست، برای همین دکمه‌های تایید/عدم‌تایید غیرفعال است.</div>`;

  const logItems = (d.log || []).slice().reverse();
  const logHtml = logItems.length ? `<div class="timeline">${logItems.map(logItemHtml).join('')}</div>`
                                   : `<div class="no-log">هنوز رویدادی برای این بارنامه ثبت نشده.</div>`;

  $('pBody').innerHTML = `
    <div class="section-title">📎 مستندات</div>
    <div class="docs-grid">${docsHtml}</div>

    <div class="section-title">⚙️ اقدام</div>
    ${noteHtml}
    ${actionsHtml}

    <div class="section-title">✉️ پیام دستی به راننده</div>
    <div class="msg-box">
      <textarea id="customMsg" placeholder="متن پیامی که مستقیم برای راننده ارسال شود…"></textarea>
      <button class="btn btn-amber" onclick="sendCustomMessage()">ارسال پیام</button>
    </div>

    <div class="section-title">📜 تاریخچه بارنامه</div>
    ${logHtml}
  `;
}

function eventClass(ev){
  if(ev.includes('تایید با کسری')) return 'ev-partial';
  if(ev.includes('عدم تایید') || ev.includes('عدم پذیرش')) return 'ev-rejected';
  if(ev.includes('تایید') || ev.includes('پذیرش')) return 'ev-approved';
  if(ev.includes('راننده')) return 'ev-driver';
  return '';
}

function logItemHtml(item){
  return `
    <div class="tl-item ${eventClass(item.event||'')}">
      <div class="tl-dot"></div>
      <div class="tl-card">
        <div class="tl-time">${esc(item.time)}</div>
        <div class="tl-event">${esc(item.event)}</div>
        ${item.actor ? `<div class="tl-actor">${esc(item.actor)}</div>` : ''}
        ${item.detail ? `<div class="tl-detail">${esc(item.detail)}</div>` : ''}
      </div>
    </div>`;
}

function toggleForm(id){
  document.querySelectorAll('.act-form').forEach(f => { if(f.id !== id) f.classList.remove('show'); });
  $(id).classList.toggle('show');
}

async function doApprove(){
  if(!confirm('تایید نهایی این بارنامه ثبت شود؟')) return;
  try{
    await api(`/api/barnames/${encodeURIComponent(CURRENT_BARNAME)}/approve`, {method:'POST'});
    toast('تایید شد ✅');
    await openPanel(CURRENT_BARNAME);
    await loadAll();
  }catch(e){ toast(e.message, true); }
}

async function doReject(){
  const reason = $('rejectReason').value.trim();
  if(!reason){ toast('علت عدم تایید را بنویس', true); return; }
  try{
    await api(`/api/barnames/${encodeURIComponent(CURRENT_BARNAME)}/reject`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({reason})
    });
    toast('عدم تایید ثبت شد');
    await openPanel(CURRENT_BARNAME);
    await loadAll();
  }catch(e){ toast(e.message, true); }
}

async function doPartial(){
  const note = $('partialNote').value.trim();
  if(!note){ toast('مقدار کسری بار را بنویس', true); return; }
  try{
    await api(`/api/barnames/${encodeURIComponent(CURRENT_BARNAME)}/partial`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({note})
    });
    toast('تایید با کسری بار ثبت شد');
    await openPanel(CURRENT_BARNAME);
    await loadAll();
  }catch(e){ toast(e.message, true); }
}

async function sendCustomMessage(){
  const text = $('customMsg').value.trim();
  if(!text){ toast('متن پیام را بنویس', true); return; }
  try{
    await api(`/api/barnames/${encodeURIComponent(CURRENT_BARNAME)}/message`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text})
    });
    toast('پیام برای راننده ارسال شد ✉️');
    $('customMsg').value = '';
    await openPanel(CURRENT_BARNAME);
  }catch(e){ toast(e.message, true); }
}

document.addEventListener('keydown', e => { if(e.key === 'Escape') closePanel(); });

if(TOKEN){ loadAll(); } else { $('tokenStatus').textContent = 'توکن وارد نشده'; }
</script>
</body>
</html>
